# Cloud Build → Cloud Run pipeline for Aesthera (MedSpa Management Software)
# Triggers on every push to main on github.com/CorySlsbry/MedSpa.
# Project: medspa-494718. Region: us-central1.

steps:
  # 1. Build the container
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web:latest"
      - "."

  # 2. Push tagged + latest to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web"

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - medspa-web
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1
      # Secrets (Secret Manager) — wire up after first deploy:
      # - --update-secrets=RESEND_API_KEY=RESEND_API_KEY:latest

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/medspa/web:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
